name: Report a problem with core
description: palette.json, the preview, image recoloring, the build or the brand assets.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: The command you ran and what happened. Include the error output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: "e.g. Node 24.1, macOS 15"
    validations:
      required: false
